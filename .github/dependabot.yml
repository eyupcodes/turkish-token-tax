version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    # The published token counts depend on these exact versions (METHOD.md).
    # Bump them by hand together with a re-run benchmark, never automatically.
    ignore:
      - dependency-name: "tiktoken"
      - dependency-name: "tokenizers"
